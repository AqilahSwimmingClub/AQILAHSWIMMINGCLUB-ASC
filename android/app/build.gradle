plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Kunci penandatanganan rilis dibaca dari android/keystore.properties.
// File itu TIDAK ikut masuk git karena berisi kata sandi. Selama file dan
// keystore-nya sama, setiap APK baru dianggap Android sebagai UPDATE dari
// aplikasi yang sudah terpasang, bukan aplikasi berbeda yang wajib uninstall.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.aqilahswimmingclub.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aqilahswimmingclub.app'
        minSdk 29
        targetSdk 35
        // Dinaikkan lewat android/gradle.properties, bukan diketik ulang di sini.
        // Android hanya mau memasang update bila versionCode lebih besar.
        versionCode Integer.parseInt(project.findProperty('ascVersionCode') ?: '1')
        versionName project.findProperty('ascVersionName') ?: '1.0.0'
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Tanpa keystore, APK rilis keluar tanpa tanda tangan dan Android
            // akan menolak memasangnya. Build sengaja dibiarkan gagal terang-terangan
            // daripada menghasilkan APK yang memaksa uninstall.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.webkit:webkit:1.12.1'

    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation 'com.google.firebase:firebase-messaging'
}

def projectRoot = rootProject.projectDir.parentFile
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('installWebDependencies', Exec) {
    workingDir projectRoot
    onlyIf { !new File(projectRoot, 'node_modules').exists() }

    if (isWindows) {
        commandLine 'cmd', '/c', 'npm install'
    } else {
        commandLine 'bash', '-lc', 'npm install'
    }
}

tasks.register('buildWeb', Exec) {
    dependsOn 'installWebDependencies'
    workingDir projectRoot

    if (isWindows) {
        commandLine 'cmd', '/c', 'npm run build'
    } else {
        commandLine 'bash', '-lc', 'npm run build'
    }
}

tasks.register('cleanWebAssets', Delete) {
    delete new File(projectDir, 'src/main/assets/public')
}

tasks.register('copyWebAssets', Copy) {
    dependsOn 'cleanWebAssets', 'buildWeb'
    from new File(projectRoot, 'dist')
    into new File(projectDir, 'src/main/assets/public')
}

preBuild.dependsOn 'copyWebAssets'