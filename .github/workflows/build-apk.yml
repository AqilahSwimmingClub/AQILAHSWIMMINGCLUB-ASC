# Menjalankan seluruh pengujian lalu membangun APK Android AQILAH Swimming Club.
#
# Dua jenis APK, dengan status yang berbeda dan TIDAK boleh tertukar:
#
#   * APK debug   - hanya untuk pengujian internal. Ditandatangani kunci debug,
#                   sehingga TIDAK dapat memperbarui aplikasi yang sudah
#                   terpasang. Artifact-nya diberi nama yang menyatakan hal itu.
#   * APK release - APK pembaruan yang sesungguhnya. Hanya dibangun bila seluruh
#                   secret penandatanganan tersedia, dan hanya dinyatakan
#                   sebagai pembaruan bila sertifikatnya terbukti sama dengan
#                   APK lama.
#
# Konfigurasi Android yang sudah ada dipertahankan apa adanya: applicationId
# com.aqilahswimmingclub.app, minSdk 29 (Android 10), targetSdk 35,
# google-services.json, dan seluruh aset aplikasi.
name: Uji dan Bangun APK

on:
  push:
    branches:
      - main
      - claude/relaxed-meitner-rx6lgd
  workflow_dispatch:
    inputs:
      buat_release:
        description: 'Buat GitHub Release untuk APK release yang terverifikasi'
        type: boolean
        default: true

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Sidik jari SHA-256 sertifikat APK lama. Sidik jari sertifikat bukan rahasia:
  # nilainya tercetak di setiap APK. Bila secret ASC_CERT_SHA256_LAMA diisi,
  # APK release wajib memakai sertifikat itu; bila kosong, kesamaan tanda tangan
  # tidak dapat dibuktikan dan APK tidak akan disebut APK pembaruan.
  TARGET_SDK_MINIMAL: '35'

jobs:
  uji-dan-bangun:
    name: Uji, build web, dan bangun APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      release_terverifikasi: ${{ steps.verifikasi_release.outputs.terverifikasi }}
      version_name: ${{ steps.versi.outputs.version_name }}
      version_code: ${{ steps.versi.outputs.version_code }}
      nama_apk_release: ${{ steps.kumpulkan.outputs.nama_apk_release }}

    steps:
      - name: Ambil commit yang tepat
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Siapkan Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Tentukan versi Playwright
        id: playwright
        run: echo "versi=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browser Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versi }}

      - name: Pasang Chromium Playwright
        run: npx playwright install --with-deps chromium

      - name: Unit test, tes tombstone, tes ID, dan verifikasi APK
        timeout-minutes: 5
        run: npm run test:unit

      - name: Tes tata letak
        timeout-minutes: 10
        run: npm run test:tata-letak

      - name: Tes sinkronisasi Supabase nyata (opsional)
        timeout-minutes: 10
        env:
          ASC_TEST_SUPABASE_URL: ${{ secrets.ASC_TEST_SUPABASE_URL }}
          ASC_TEST_SUPABASE_KEY: ${{ secrets.ASC_TEST_SUPABASE_KEY }}
        run: npm run test:supabase

      - name: E2E responsif pada aplikasi production
        timeout-minutes: 20
        env:
          ASC_SHOT_SCOPE: ringkas
          ASC_E2E_TIMEOUT_MS: '180000'
        run: npm run test:e2e

      - name: Simpan screenshot bukti E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-responsif-${{ github.sha }}
          path: bukti-responsif/
          retention-days: 7
          if-no-files-found: warn

      - name: Build production web
        run: npm run build

      - name: Siapkan Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Sinkronkan aset web ke proyek Android
        run: npx cap sync android

      - name: Pastikan aset web APK berasal dari commit ini
        run: |
          set -euo pipefail
          BUNDEL=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          if [ ! -f "android/app/src/main/assets/public/assets/${BUNDEL}" ]; then
            echo "Aset web Android tidak cocok dengan hasil build commit ini (${BUNDEL} tidak ada)."
            exit 1
          fi
          echo "Aset web APK cocok dengan build commit ini: ${BUNDEL}"

      - name: Baca versi aplikasi
        id: versi
        run: |
          set -euo pipefail
          echo "version_name=$(grep -E '^ascVersionName=' android/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(grep -E '^ascVersionCode=' android/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # --- APK debug: HANYA untuk pengujian, bukan APK pembaruan -------------
      - name: Bangun APK debug (hanya untuk pengujian)
        timeout-minutes: 20
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # --- Penandatanganan release ------------------------------------------
      # Nilai secret tidak pernah dicetak. Keystore hanya ada selama job berjalan.
      - name: Siapkan keystore rilis
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "tersedia=false" >> "$GITHUB_OUTPUT"
            echo "Secret penandatanganan belum lengkap. APK release TIDAK dibangun."
            echo "Hanya APK debug yang tersedia, dan APK debug tidak dapat memperbarui aplikasi terpasang."
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > android/asc-release.jks
          {
            echo "storeFile=asc-release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/keystore.properties
          echo "tersedia=true" >> "$GITHUB_OUTPUT"
          echo "Keystore rilis disiapkan."

      - name: Bangun APK release bertanda tangan
        if: steps.signing.outputs.tersedia == 'true'
        timeout-minutes: 20
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      # --- Verifikasi: identitas, tanda tangan, dan kelayakan pembaruan ------
      - name: Verifikasi APK release
        id: verifikasi_release
        if: steps.signing.outputs.tersedia == 'true'
        env:
          CERT_LAMA: ${{ secrets.ASC_CERT_SHA256_LAMA }}
          VERSION_CODE_LAMA: ${{ secrets.ASC_VERSION_CODE_LAMA }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          ARG=(--apk "${APK}" --target-sdk-minimal "${TARGET_SDK_MINIMAL}" --json verifikasi-release.json)
          if [ -n "${CERT_LAMA}" ]; then ARG+=(--sidik-jari "${CERT_LAMA}"); fi
          if [ -n "${VERSION_CODE_LAMA}" ]; then ARG+=(--version-code-lama "${VERSION_CODE_LAMA}"); fi

          set +e
          node scripts/verifikasi-apk.cjs "${ARG[@]}"
          KODE=$?
          set -e

          # 0 = terbukti dapat memperbarui; 2 = APK sah tetapi acuan APK lama
          # tidak tersedia; selain itu = benar-benar gagal.
          if [ "${KODE}" -eq 0 ]; then
            echo "terverifikasi=true" >> "$GITHUB_OUTPUT"
          elif [ "${KODE}" -eq 2 ]; then
            echo "terverifikasi=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK release sah, tetapi kesamaan sertifikat dengan APK lama belum dapat dibuktikan karena secret ASC_CERT_SHA256_LAMA belum diisi. APK ini belum boleh disebut APK pembaruan."
          else
            echo "::error::APK release tidak memenuhi syarat sebagai pembaruan."
            exit 1
          fi

      - name: Verifikasi tanda tangan dengan apksigner
        if: steps.signing.outputs.tersedia == 'true'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort | tail -1)
          "${APKSIGNER}" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      # --- Kumpulkan keluaran ------------------------------------------------
      - name: Kumpulkan APK dan hitung SHA-256
        id: kumpulkan
        run: |
          set -euo pipefail
          mkdir -p keluaran-apk
          VN="${{ steps.versi.outputs.version_name }}"
          VC="${{ steps.versi.outputs.version_code }}"
          PENDEK="${GITHUB_SHA::7}"

          # APK debug diberi nama yang menyatakan statusnya, supaya tidak pernah
          # dikira APK pembaruan.
          DEBUG_APK="ASC-${VN}-${VC}-DEBUG-UJI-SAJA-${PENDEK}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "keluaran-apk/${DEBUG_APK}"
          echo "nama_apk_debug=${DEBUG_APK}" >> "$GITHUB_OUTPUT"

          RELEASE_SRC=android/app/build/outputs/apk/release/app-release.apk
          if [ -f "${RELEASE_SRC}" ]; then
            RELEASE_APK="ASC-${VN}-${VC}-release-${PENDEK}.apk"
            cp "${RELEASE_SRC}" "keluaran-apk/${RELEASE_APK}"
            echo "nama_apk_release=${RELEASE_APK}" >> "$GITHUB_OUTPUT"
          fi

          cd keluaran-apk
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Periksa identitas APK debug
        run: |
          set -euo pipefail
          node scripts/verifikasi-apk.cjs \
            --apk "keluaran-apk/${{ steps.kumpulkan.outputs.nama_apk_debug }}" \
            --target-sdk-minimal "${TARGET_SDK_MINIMAL}" || KODE=$?
          # Kode 2 wajar untuk APK debug: identitasnya benar, tetapi memang tidak
          # punya acuan APK lama dan memang bukan APK pembaruan.
          if [ "${KODE:-0}" -gt 2 ]; then exit 1; fi
          echo "Identitas APK debug sesuai (applicationId, minSdk 29, targetSdk)."

      - name: Unggah APK debug (bukan APK pembaruan)
        uses: actions/upload-artifact@v4
        with:
          name: asc-apk-DEBUG-UJI-SAJA-${{ steps.versi.outputs.version_name }}-${{ steps.versi.outputs.version_code }}
          path: |
            keluaran-apk/*DEBUG-UJI-SAJA*.apk
            keluaran-apk/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

      - name: Unggah APK release
        if: steps.signing.outputs.tersedia == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asc-apk-release-${{ steps.versi.outputs.version_name }}-${{ steps.versi.outputs.version_code }}
          path: |
            keluaran-apk/*release*.apk
            keluaran-apk/SHA256SUMS.txt
            verifikasi-release.json
          retention-days: 90
          if-no-files-found: error

      # Artifact hilang setelah masa simpannya habis, jadi APK release yang sudah
      # terbukti sebagai pembaruan disimpan permanen sebagai GitHub Release.
      - name: Buat GitHub Release untuk APK yang terverifikasi
        if: steps.verifikasi_release.outputs.terverifikasi == 'true' && (github.event_name != 'workflow_dispatch' || inputs.buat_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versi.outputs.version_name }}-${{ steps.versi.outputs.version_code }}
          name: ASC ${{ steps.versi.outputs.version_name }} (versionCode ${{ steps.versi.outputs.version_code }})
          body: |
            APK pembaruan AQILAH Swimming Club.

            Sertifikat penandatangan terbukti sama dengan APK lama, dan versionCode
            lebih tinggi. Pasang langsung menimpa aplikasi yang sudah ada di HP.
            **Jangan uninstall** — data aplikasi, sesi login, dan cache dipertahankan.

            - applicationId: `com.aqilahswimmingclub.app`
            - versionName: `${{ steps.versi.outputs.version_name }}`
            - versionCode: `${{ steps.versi.outputs.version_code }}`
            - minSdk: `29` (Android 10 ke atas)
            - targetSdk: `35`
            - Commit: `${{ github.sha }}`

            SHA-256 setiap berkas ada di `SHA256SUMS.txt`.
          files: |
            keluaran-apk/*release*.apk
            keluaran-apk/SHA256SUMS.txt
          draft: false
          prerelease: false

      - name: Hapus berkas rahasia dari runner
        if: always()
        run: rm -f android/asc-release.jks android/keystore.properties

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "## Hasil build APK"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- applicationId: \`com.aqilahswimmingclub.app\`"
            echo "- versionName: \`${{ steps.versi.outputs.version_name }}\`"
            echo "- versionCode: \`${{ steps.versi.outputs.version_code }}\`"
            echo "- minSdk 29 (Android 10 ke atas), targetSdk 35"
            echo ""
            if [ "${{ steps.signing.outputs.tersedia }}" != "true" ]; then
              echo "### APK release: TIDAK dibangun"
              echo ""
              echo "Secret penandatanganan belum lengkap. Yang tersedia hanya APK debug,"
              echo "dan **APK debug tidak dapat memperbarui aplikasi yang sudah terpasang**"
              echo "karena ditandatangani kunci yang berbeda."
              echo ""
              echo "Tambahkan secret berikut agar APK pembaruan dapat dibuat:"
              echo "\`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`,"
              echo "\`ANDROID_KEY_ALIAS\`, \`ANDROID_KEY_PASSWORD\`, dan"
              echo "\`ASC_CERT_SHA256_LAMA\` (sidik jari sertifikat APK lama)."
            elif [ "${{ steps.verifikasi_release.outputs.terverifikasi }}" = "true" ]; then
              echo "### APK release: TERVERIFIKASI sebagai APK pembaruan"
              echo ""
              echo "Sertifikat sama dengan APK lama dan versionCode naik."
              echo "Pasang langsung menimpa aplikasi lama, tanpa uninstall."
            else
              echo "### APK release: dibangun, tetapi BELUM terbukti sebagai pembaruan"
              echo ""
              echo "Secret \`ASC_CERT_SHA256_LAMA\` belum diisi, sehingga kesamaan"
              echo "sertifikat dengan APK lama tidak dapat dibuktikan."
            fi
            echo ""
            if [ -f keluaran-apk/SHA256SUMS.txt ]; then
              echo "### SHA-256"
              echo '```'
              cat keluaran-apk/SHA256SUMS.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
