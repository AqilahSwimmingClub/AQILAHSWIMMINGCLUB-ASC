    <script>
      // Pada HTTP lokal (localhost maupun alamat IP Wi-Fi), hapus service worker/cache lama
      // agar modul Vite selalu dimuat langsung dari server pengembangan.
      if (location.protocol === 'http:') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations =>
            Promise.all(registrations.map(registration => registration.unregister()))
          ).catch(() => {});
        }
        if ('caches' in window) {
          caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))).catch(() => {});
        }
      }
      window.addEventListener('error', function (event) {
        const app = document.getElementById('app');
        if (app && !app.innerHTML.trim()) {
          app.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#061d3b;color:white;padding:24px;font-family:Arial;text-align:center"><div><h2>Aplikasi gagal dimuat</h2><p>Silakan muat ulang halaman. Jika masih terjadi, periksa Console browser.</p><small>' + String(event.message || 'Kesalahan JavaScript') + '</small></div></div>';
        }
      });
    </script>
    <script type="module" crossorigin src="./assets/index-9UYnsBUX.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CtQhl0NH.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
